<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#06111f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Alert Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alert Level Tracker</title>
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>

    <main class="app" aria-label="Alert Level Tracker">
      <header class="topbar">
        <div>
          <svg class="game-title" viewBox="0 0 420 76" role="img" aria-labelledby="gameTitle">
            <title id="gameTitle">Agents & Aliens</title>
            <defs>
              <linearGradient id="silverFill" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#344958"/>
                <stop offset="50%" stop-color="#f8fdff"/>
                <stop offset="100%" stop-color="#344958"/>
              </linearGradient>
              <linearGradient id="silverStroke" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#dbe7ee"/>
                <stop offset="45%" stop-color="#07111a"/>
                <stop offset="100%" stop-color="#6f8796"/>
              </linearGradient>
            </defs>
            <g>
              <text x="210" y="58" text-anchor="middle">Agents & Aliens</text>
            </g>
          </svg>
          <h1>Alert Level</h1>
        </div>
      </header>

      <section class="tracker-panel" aria-label="Tracker controls">
        <div class="meter-wrap">
          <ol class="meter" id="meter" aria-label="Alert levels from 15 down to 0"></ol>
        </div>

        <div class="controls" aria-label="Adjust alert level">
          <button class="control ghost" id="downBtn" type="button" aria-label="Decrease alert level">
            <span aria-hidden="true">-</span>
          </button>
          <button class="control reset" id="resetBtn" type="button">Reset</button>
          <button class="control ghost" id="upBtn" type="button" aria-label="Increase alert level">
            <span aria-hidden="true">+</span>
          </button>
        </div>
      </section>
    </main>

    <div class="lose-modal" id="loseModal" role="dialog" aria-modal="true" aria-labelledby="loseTitle" hidden>
      <div class="lose-box">
        <svg class="lose-skull" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2C7.6 2 4 5.3 4 9.4c0 2.5 1.2 4.7 3.1 6v3.2c0 .8.6 1.4 1.4 1.4h7c.8 0 1.4-.6 1.4-1.4v-3.2c1.9-1.3 3.1-3.5 3.1-6C20 5.3 16.4 2 12 2Zm-3.1 9.7c-1 0-1.8-.8-1.8-1.8s.8-1.8 1.8-1.8 1.8.8 1.8 1.8-.8 1.8-1.8 1.8Zm3.1 4.1-1.2-1.8h2.4L12 15.8Zm3.1-4.1c-1 0-1.8-.8-1.8-1.8s.8-1.8 1.8-1.8 1.8.8 1.8 1.8-.8 1.8-1.8 1.8Z"/>
        </svg>
        <h2 id="loseTitle">You Lose!</h2>
        <button class="restart-button" id="restartBtn" type="button">Restart</button>
      </div>
    </div>

    <div class="reroll-modal" id="rerollModal" role="dialog" aria-modal="true" aria-labelledby="rerollTitle" hidden>
      <div class="reroll-box">
        <img class="reroll-image" src="images/reroll-barricades.png" alt="" width="768" height="512">
        <h2 id="rerollTitle">Reroll the Barricades</h2>
        <button class="okay-button" id="rerollOkayBtn" type="button">Okay</button>
      </div>
    </div>

    <div class="reset-modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle" hidden>
      <div class="reset-box">
        <img class="reset-image" src="images/reset-confirm.png" alt="" width="526" height="512">
        <h2 id="resetTitle">Are you sure?</h2>
        <div class="reset-actions">
          <button class="reset-choice yes" id="resetYesBtn" type="button">Yes</button>
          <button class="reset-choice no" id="resetNoBtn" type="button">No</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
